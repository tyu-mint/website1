name: Build Single Calendar APK

on:
  push:
    branches: [main]
    paths:
      - "android-widget/**"
      - ".github/workflows/build-single-calendar-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-widget
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp android-widget/app/build/outputs/apk/debug/app-debug.apk SingleCalendarWidget.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingleCalendarWidget
          path: SingleCalendarWidget.apk
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: single-calendar-v${{ github.run_number }}
          name: 单向历小组件 v1.0.${{ github.run_number }}
          body: |
            单向历安卓桌面小组件，适配 Android / HyperOS。
            
            - 按北京时间每日更新
            - 点击小组件可手动刷新
            - 网络失败时保留上次成功图片
          files: SingleCalendarWidget.apk
          fail_on_unmatched_files: true
