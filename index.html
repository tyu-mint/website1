<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>单向历</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body { display: flex; justify-content: center; align-items: flex-start; }
    img { display: block; width: 100%; height: auto; max-width: 100%; }
    #error { display: none; padding: 24px; color: #555; font: 14px/1.6 system-ui, sans-serif; }
  </style>
</head>
<body>
  <img id="calendar" alt="单向历" referrerpolicy="no-referrer">
  <div id="error">当天图片加载失败。<a id="direct-link" target="_blank" rel="noopener noreferrer">点此直接打开图片</a></div>
  <script>
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Shanghai",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());
    const date = Object.fromEntries(parts.map(part => [part.type, part.value]));
    const imageUrl = "https://img.owspace.com/Public/uploads/Download/" +
      date.year + "/" + date.month + date.day + ".jpg";
    const image = document.getElementById("calendar");
    image.referrerPolicy = "no-referrer";
    image.onload = () => { document.getElementById("error").style.display = "none"; };
    image.onerror = () => {
      document.getElementById("error").style.display = "block";
      document.getElementById("direct-link").href = imageUrl;
    };
    image.src = imageUrl;
  </script>
</body>
</html>
